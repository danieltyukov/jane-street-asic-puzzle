name: ci

on:
  push:
  pull_request:

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Cache the SKY130 library
        uses: actions/cache@v6
        with:
          path: pdk
          key: sky130-hd-${{ hashFiles('Makefile') }}

      - name: Set up
        run: make setup pdk

      - name: Tests
        run: make test

      - name: Full solve
        run: make all

      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            build/results.json
            build/results.log
            build/puzzle_extracted.v
            build/solution.vcd
